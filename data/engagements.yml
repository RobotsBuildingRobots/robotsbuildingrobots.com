process: With engagements helping small startups to large enterprises, we bring both technical knowledge and industry-leading processes to help you achieve your vision.  We are not a cookie-cutter service provider. Through effective collaboration and tailoring the project to the needs of the business, we achieve project success.

projects:
  -
    id: 1
    company: Serenity
    status: on-going
    collaboration: >-
      Commanding an agentic build system for a client-management SaaS platform serving a timeshare-relief and financial-recovery consulting firm: 20 instruction files, 2,926 lines, govern how AI writes the code. Built on Rails 8.1 and Ruby 4.0 with Solid Queue, Cache, and Cable running on PostgreSQL 17 instead of Redis, and a 63-table domain carved into 118 service objects. Claude Code runs recurring multi-agent security audits of the live app, five agents in parallel with runtime verification; MCP-driven Playwright suites test the app in a real browser; and AI-generated summaries ship in the product itself. More test code than application code, zero RuboCop violations, clean Brakeman, 600+ PRs in 7.5 months, still building.
  -
    id: 2
    company: SOFware
    collaboration: >-
      Engineered the qualification-tracking and scheduling capabilities U.S. Air Force Special Warfare units (JTAC, Combat Control, Special Tactics, TACP) rely on to manage operator training readiness under AFMAN 10-3500, serving as senior full-stack engineer across two Ruby on Rails applications and a shared gem, centered on an event-driven GraphQL domain. Built operator disenrollment end to end, from GraphQL API to dossier projections; designed a designation-scoped competency-construction API that applies JTAC requirements to individual operators; and led a CMMC security-hardening pass that protects CSV exports against spreadsheet formula injection.
  -
    id: 3
    company: Arthur Maxwell
    collaboration: >-
      Took an offline iPad-driven eLearning management and classroom application to the web for global enterprise clients, rebuilding it on Ruby on Rails with Hotwire (Turbo + Stimulus).
  -
    id: 4
    company: SafeAccess
    collaboration: >-
      Built the technical hiring pipeline and personally recruited the senior Ruby on Rails engineer who succeeded the co-founder and senior technical architect, securing continuity of innovation and application development.
  -
    id: 5
    company: Sidebench
    collaboration: >-
      Technical Architect for the Momints NFT Marketplace: drove the research and selection of scalable components, built the MVP, and produced the marketing materials. Authored the architecture package spanning system diagrams, server infrastructure, tech stack, third-party dependencies, data models, database schemas, and API specifications, giving the build team a straight line through development.
  -
    id: 6
    company: Advanced Building Technology
    collaboration: >-
      Led the rearchitecture of a website to a mobile-first responsive design in Ruby, cutting hosting costs, adding precise traffic measurement and monitoring, and sharpening the experience across mobile and tablet.
  -
    id: 7
    company: Eggplant
    collaboration: >-
      Integrated Microsoft Active Directory (LDAP) into the authorization layer of a test-management application on the Digital Automation Intelligence platform. Ran daily pair programming sessions that mentored junior engineers and sharpened team performance, and introduced RSpec to expand test coverage across the platform.
  -
    id: 8
    company: Crowd Ox
    collaboration: >-
      Raised a legacy code base to over 60% test coverage with 100% model coverage, migrating the Partner application's test suite from Minitest to RSpec while expanding platform features across three Ruby on Rails engines.
  -
    id: 9
    company: USA Today
    collaboration: >-
      Engineered a backend CMS with frontend content-creation interfaces and a responsive design that tightened user flows and elevated the customer experience.
  -
    id: 10
    company: W. W. Norton
    collaboration: >-
      Architected and shipped an interactive delivery platform serving over 300 interactives globally, and set the engineering bar for the team: GitFlow, code reviews, quality guidelines, and workflow management. Mentored junior engineers, raising their productivity and contributions.
  -
    id: 11
    company: Gathrly
    collaboration: >-
      Partnered with the founders to set the technical product roadmap and bring agile to the team. Led the design, engineering, and ongoing evolution of a lead management system for elite brewers, building a high-performance environment and mentoring junior engineers to raise their skills and output.
